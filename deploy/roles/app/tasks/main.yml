---
# ╔══════════════════════════════════════════════════════════════╗
# ║  Role: app — Build & Deploy atstex-lab                      ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Clone / Update Repository ────────────────────────────────
- name: Clone or update application repository
  git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}/src"
    version: "{{ app_branch }}"
    force: yes
    accept_hostkey: yes
  become_user: "{{ deploy_user }}"

# ── Generate .env File ──────────────────────────────────────
- name: Deploy environment file
  template:
    src: env.j2
    dest: "{{ app_dir }}/src/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"

# ── Deploy Docker Compose ───────────────────────────────────
- name: Deploy application Docker Compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose-app.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"

# ── Tag Previous Image for Rollback ─────────────────────────
- name: Check if current image exists
  command: docker images -q {{ app_name }}:latest
  register: current_image
  changed_when: false
  ignore_errors: yes
  become_user: "{{ deploy_user }}"

- name: Tag current image as rollback
  command: docker tag {{ app_name }}:latest {{ app_name }}:rollback
  when: current_image.stdout | length > 0
  become_user: "{{ deploy_user }}"

# ── Build Application Image ─────────────────────────────────
- name: Build Docker image
  command: docker compose -f docker-compose-app.yml build --no-cache
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ deploy_user }}"
  register: build_result

- name: Display build output
  debug:
    msg: "{{ build_result.stdout_lines[-10:] }}"
  when: build_result is defined

# ── Deploy Application ──────────────────────────────────────
- name: Stop existing application container
  command: docker compose -f docker-compose-app.yml down
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ deploy_user }}"
  ignore_errors: yes

- name: Start application container
  command: docker compose -f docker-compose-app.yml up -d
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ deploy_user }}"

# ── Health Check ─────────────────────────────────────────────
- name: Wait for application to start
  uri:
    url: "http://127.0.0.1:{{ app_port }}"
    status_code: [200, 301, 302]
    timeout: 5
  register: health_check
  retries: 12
  delay: 5
  until: health_check.status in [200, 301, 302]

- name: Display deployment status
  debug:
    msg: "✅ {{ app_name }} deployed successfully! Status: {{ health_check.status }}"

# ── Cleanup Old Images ──────────────────────────────────────
- name: Remove dangling Docker images
  command: docker image prune -f
  become_user: "{{ deploy_user }}"
  changed_when: false

# ── Copy Utility Scripts ────────────────────────────────────
- name: Copy deployment scripts to server
  copy:
    src: "{{ playbook_dir }}/../scripts/{{ item }}"
    dest: "{{ app_dir }}/scripts/{{ item }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"
  loop:
    - backup-db.sh
    - restore-db.sh
    - rollback.sh
    - health-check.sh
