---
# ==========================================
# PERSISTENT VOLUME CLAIMS
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: atstex-lab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# ==========================================
# TECTONIC CACHE PVC
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tectonic-cache-pvc
  namespace: atstex-lab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
