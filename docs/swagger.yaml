host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is the API server for ATS-Tex Lab, a custom CV builder and ATS
    simulator.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: ATS-Tex Lab API
  version: "1.0"
paths:
  /api/admin/feedbacks:
    get:
      description: Get a paginated list of all user feedbacks
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Search keyword
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/problem.Problem'
      security:
      - BearerAuth: []
      summary: List Feedbacks (Admin)
      tags:
      - Admin
  /api/admin/feedbacks/{id}:
    delete:
      description: Permanently delete a feedback item
      parameters:
      - description: Feedback ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/problem.Problem'
      security:
      - BearerAuth: []
      summary: Delete Feedback
      tags:
      - Admin
  /api/admin/feedbacks/{id}/reply:
    post:
      consumes:
      - application/json
      description: Admin provides an official reply to a user's feedback
      parameters:
      - description: Feedback ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Reply content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.AdminReplyFeedbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/problem.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/problem.Problem'
      security:
      - BearerAuth: []
      summary: Reply to Feedback (Admin)
      tags:
      - Admin
  /api/admin/stats:
    get:
      description: Get aggregate platform statistics for the admin dashboard
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/problem.Problem'
      security:
      - BearerAuth: []
      summary: Admin Stats
      tags:
      - Admin
  /api/admin/subscription-plans:
    get:
      description: Get a list of all subscription plans (Admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_semmidev_atstex-lab_internal_domain.SubscriptionPlan'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/problem.Problem'
      security:
      - BearerAuth: []
      summary: List Subscription Plans
      tags:
      - Admin Subscriptions
    post:
      consumes:
      - application/json
      description: Create a new subscription plan (Admin only)
      parameters:
      - description: Plan data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_semmidev_atstex-lab_internal_domain.SubscriptionPlan'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_semmidev_atstex-lab_internal_domain.SubscriptionPlan'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/problem.Problem'
      security:
      - BearerAuth: []
      summary: Create Subscription Plan
      tags:
      - Admin Subscriptions
  /api/admin/subscription-plans/{id}:
    delete:
      description: Permanently delete a subscription plan
      parameters:
      - description: Plan ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/problem.Problem'
      security:
      - BearerAuth: []
      summary: Delete Subscription Plan
      tags:
      - Admin Subscriptions
    put:
      consumes:
      - application/json
      description: Update an existing subscription plan (Admin only)
      parameters:
      - description: Plan ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Plan data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_semmidev_atstex-lab_internal_domain.SubscriptionPlan'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_semmidev_atstex-lab_internal_domain.SubscriptionPlan'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/problem.Problem'
      security:
      - BearerAuth: []
      summary: Update Subscription Plan
      tags:
      - Admin Subscriptions
  /api/admin/subscription-plans/{id}/toggle:
    post:
      consumes:
      - application/json
      description: Activate or deactivate a subscription plan
      parameters:
      - description: Plan ID
