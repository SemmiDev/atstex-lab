{{define "gallery"}}
<!DOCTYPE html>
<html lang="id">

<head>
  {{template "head" .}}
  <title>ATSTEXLAB — Galeri Template CV</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <link rel="stylesheet" href="/static/css/editor.css" />
  <link rel="stylesheet" href="/static/css/gallery.css" />
</head>

<body class="flex flex-col md:flex-row h-dvh w-full bg-bg font-ui text-text overflow-hidden" {{if .User}}data-user-id="{{.User.ID}}"{{end}}>

  <!-- Mobile Header overlay toggle -->
  <div class="md:hidden flex items-center justify-between p-4 bg-surface border-b-[4px] border-border z-40">
    <div class="font-disp font-extrabold text-2xl">ATSTEX<em class="text-accent italic">LAB</em></div>
    <button id="sidebar-toggle" class="text-3xl"><i class="ph ph-list"></i></button>
  </div>

  <!-- The Sidebar -->
  {{template "sidebar" .}}

  <!-- Overlay for mobile clicking -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden"></div>

  <!-- Main Content -->
  <main class="flex-1 min-h-0 overflow-y-auto bg-bg flex flex-col h-full relative">

    <!-- Gallery Header -->
    <div class="gallery-header">
      <h1><i class="ph ph-images-square"></i> Galeri Template</h1>
      <span class="gallery-subtitle">Lihat semua template dengan biodata Anda, lalu pilih yang terbaik</span>
      <button class="btn btn-primary" id="btn-generate">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-label"><i class="ph-bold ph-arrows-clockwise"></i> Refresh Semua</span>
      </button>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-scroll">
      <div class="gallery-grid" id="gallery-grid">
        <!-- Cards injected by JS -->
        <div class="gallery-empty">
          <span class="empty-icon">🎨</span>
          <p>Tekan <strong>Refresh Semua</strong> untuk melihat biodata Anda di semua template secara bersamaan.</p>
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="gallery-statusbar">
      <span class="status-dot" id="gallery-status-dot"></span>
      <span id="gallery-status-text">Siap</span>
      <span style="margin-left:auto" id="gallery-status-elapsed"></span>
    </div>

  </main>

  <script type="module" src="/static/js/gallery.js"></script>
  <script src="/static/js/sidebar.js"></script>

    <script src="/static/js/dark-mode.js"></script>
</body>

</html>
{{end}}
