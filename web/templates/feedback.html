{{define "feedback"}}
<!DOCTYPE html>
<html lang="id">

<head>
    {{template "head" .}}
    <title>atstex-lab — Feedback</title>
</head>

<body class="flex flex-col md:flex-row h-dvh w-full bg-bg font-ui text-text overflow-hidden">
    <!-- Mobile Header overlay toggle -->
    <div class="md:hidden flex items-center justify-between p-4 bg-surface border-b-[4px] border-border z-40">
        <div class="font-disp font-extrabold text-2xl">ATSTEX<em class="text-accent italic">LAB</em></div>
        <button id="sidebar-toggle" class="text-3xl"><i class="ph ph-list"></i></button>
    </div>

    <!-- The Sidebar -->
    {{template "sidebar" .}}

    <!-- Overlay for mobile clicking -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden"></div>

    <main class="flex-1 min-h-0 overflow-y-auto bg-bg relative p-6 md:p-10 flex justify-center">
        <div class="w-full max-w-3xl flex flex-col gap-8">

            <!-- Header -->
            <div class="flex flex-col gap-2">
                <h1 class="text-3xl font-extrabold uppercase tracking-wide border-b-[3px] border-border pb-2 flex items-center gap-3">
                    <i class="ph-bold ph-chat-circle-text text-3xl"></i> Kritik & Saran
                </h1>
                <p class="font-semibold text-muted">Bagikan ide, laporan bug, atau saran Anda untuk membantu kami meningkatkan ATSTEXLAB.</p>
            </div>

            <!-- Submit Form -->
            <div class="bg-surface border-[3px] border-border p-6 shadow-[4px_4px_0_#000]">
                <h2 class="text-lg font-extrabold uppercase tracking-wide mb-4 flex items-center gap-2">
                    <i class="ph-bold ph-pencil-simple-line"></i> Masukan Baru
                </h2>
                <form id="feedback-form" class="flex flex-col gap-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-bold uppercase tracking-wider text-muted">Subjek</label>
                        <input type="text" id="fb-subject" placeholder="misal. Permintaan fitur, Laporan bug…"
                            class="px-4 py-3 border-[3px] border-border bg-bg font-mono text-sm focus:outline-none focus:border-accent focus:shadow-[3px_3px_0_var(--accent)]"
                            maxlength="200" required>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-bold uppercase tracking-wider text-muted">Pesan</label>
                        <textarea id="fb-message" rows="4" placeholder="Jelaskan masukan Anda secara detail…"
                            class="px-4 py-3 border-[3px] border-border bg-bg font-mono text-sm resize-y focus:outline-none focus:border-accent focus:shadow-[3px_3px_0_var(--accent)]"
                            maxlength="2000" required></textarea>
                    </div>
                    <div class="flex items-center gap-3">
                        <button type="submit" class="btn" id="fb-submit-btn">
                            <i class="ph-bold ph-paper-plane-tilt"></i> Kirim Masukan
                        </button>
                        <span id="fb-status" class="text-sm font-bold"></span>
                    </div>
                </form>
            </div>

            <!-- Feedback list -->
            <div class="flex flex-col gap-2">
                <h2 class="text-2xl font-extrabold uppercase tracking-wide border-b-[3px] border-border pb-2 flex items-center gap-3">
                    <i class="ph-bold ph-list-checks text-3xl"></i> Masukan Saya
                </h2>
            </div>

            <div id="fb-list" class="flex flex-col gap-4">
                <div class="text-center text-muted font-semibold py-8">Memuat…</div>
            </div>
        </div>
    </main>

    <script>
        // Feedback
        const fbForm = document.getElementById('feedback-form');
        const fbSubject = document.getElementById('fb-subject');
        const fbMessage = document.getElementById('fb-message');
        const fbStatus = document.getElementById('fb-status');
        const fbSubmitBtn = document.getElementById('fb-submit-btn');
        const fbList = document.getElementById('fb-list');

        fbForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const subject = fbSubject.value.trim();
            const message = fbMessage.value.trim();
            if (!subject || !message) return;
            if (subject.length > 200) {
                fbStatus.textContent = '✗ Subjek harus di bawah 200 karakter';
                fbStatus.style.color = 'var(--error)';
                return;
            }
            if (message.length > 2000) {
                fbStatus.textContent = '✗ Pesan harus di bawah 2000 karakter';
                fbStatus.style.color = 'var(--error)';
                return;
            }

            fbSubmitBtn.disabled = true;
            fbStatus.textContent = 'Mengirim…';
            fbStatus.style.color = 'var(--muted)';

            try {
                const res = await fetch('/api/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subject, message }),
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Gagal');
                }
                fbSubject.value = '';
                fbMessage.value = '';
                fbStatus.textContent = '✓ Terkirim!';
                fbStatus.style.color = 'var(--accent2)';
                loadFeedbacks();
            } catch (err) {
                fbStatus.textContent = '✗ ' + err.message;
                fbStatus.style.color = 'var(--error)';
            } finally {
                fbSubmitBtn.disabled = false;
                setTimeout(() => { fbStatus.textContent = ''; }, 3000);
            }
        });

        async function loadFeedbacks() {
            try {
                const res = await fetch('/api/feedback');
                if (!res.ok) throw new Error('Gagal');
                const feedbacks = await res.json();
                renderFeedbacks(feedbacks || []);
            } catch (e) {
                fbList.innerHTML = '<div class="text-center text-error font-semibold py-8">Gagal memuat masukan</div>';
            }
        }

        function renderFeedbacks(feedbacks) {
            if (!feedbacks.length) {
                fbList.innerHTML = '<div class="text-center text-muted font-semibold py-8">Belum ada masukan. Jadilah yang pertama! 🚀</div>';
                return;
            }

            fbList.innerHTML = feedbacks.map(fb => {
                const date = new Date(fb.createdAt).toLocaleDateString('id-ID', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                const hasReply = fb.adminReply && fb.adminReply.length > 0;
                const statusBadge = hasReply
                    ? '<span style="display:inline-block;padding:2px 8px;font-size:0.7rem;font-weight:700;text-transform:uppercase;border:2px solid var(--border);background:var(--accent2);color:#fff;">Dibalas</span>'
                    : '<span style="display:inline-block;padding:2px 8px;font-size:0.7rem;font-weight:700;text-transform:uppercase;border:2px solid var(--border);background:var(--bg);color:var(--muted);">Tertunda</span>';

                let replyBlock = '';
                if (hasReply) {
                    const replyDate = fb.repliedAt ? new Date(fb.repliedAt).toLocaleDateString('id-ID', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
                    replyBlock = `
                        <div style="margin-top:12px;padding:12px 16px;border:2px solid var(--accent2);background:rgba(139,92,246,0.05);">
                            <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--accent2);margin-bottom:4px;">
                                <i class="ph-bold ph-shield-check"></i> Balasan Admin ${replyDate ? '· ' + replyDate : ''}
                            </div>
                            <div style="font-size:0.9rem;white-space:pre-wrap;">${escHtml(fb.adminReply)}</div>
                        </div>`;
                }

                return `
                    <div class="bg-surface border-[3px] border-border p-5 shadow-[4px_4px_0_#000]">
                        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
                            <div style="flex:1;">
                                <h3 style="font-size:1rem;font-weight:800;margin:0 0 4px 0;text-transform:uppercase;">${escHtml(fb.subject)}</h3>
                                <span style="font-size:0.75rem;color:var(--muted);font-family:var(--font-mono);">${date}</span>
                            </div>
                            ${statusBadge}
                        </div>
                        <div style="margin-top:12px;font-size:0.9rem;white-space:pre-wrap;line-height:1.6;">${escHtml(fb.message)}</div>
                        ${replyBlock}
                    </div>`;
            }).join('');
        }

        function escHtml(str) {
            const el = document.createElement('span');
            el.textContent = str || '';
            return el.innerHTML;
        }

        loadFeedbacks();
    </script>
    <script src="/static/js/dark-mode.js"></script>
</body>

</html>
{{end}}
