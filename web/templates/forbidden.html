{{define "forbidden"}}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>403 — Forbidden | ATSTEXLAB</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=DM+Sans:wght@400;500;700;800&family=DM+Serif+Display:ital@0;1&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #FFFBF0;
            --surface: #fff;
            --text: #1a1a1a;
            --border: #1a1a1a;
            --accent: #ff4794;
            --accent2: #8b5cf6;
            --muted: #6b6b6b;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: var(--surface);
            border: 4px solid var(--border);
            box-shadow: 8px 8px 0 var(--border);
            max-width: 520px;
            width: 100%;
            text-align: center;
            padding: 3rem 2.5rem;
            animation: cardPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardPop {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .error-code {
            font-family: 'Fira Code', monospace;
            font-size: 6rem;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .error-title {
            font-family: 'DM Sans', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 1rem;
        }

        .error-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: shake 2s ease-in-out infinite;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            10% { transform: rotate(-10deg); }
            20% { transform: rotate(10deg); }
            30% { transform: rotate(-5deg); }
            40% { transform: rotate(5deg); }
            50%, 100% { transform: rotate(0deg); }
        }

        .error-msg {
            font-size: 1rem;
            color: var(--muted);
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .divider {
            height: 3px;
            background: var(--border);
            margin: 1.5rem 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            text-decoration: none;
            color: #fff;
            background: var(--accent2);
            border: 3px solid var(--border);
            box-shadow: 4px 4px 0 var(--border);
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--border);
        }

        .btn:active {
            transform: translate(0, 0);
            box-shadow: 2px 2px 0 var(--border);
        }

        .footer-text {
            margin-top: 1.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .logo {
            font-family: 'DM Serif Display', serif;
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }

        .logo em {
            color: var(--accent);
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">ATSTEX<em>LAB</em></div>
        <div class="error-icon"><i class="ph-bold ph-shield-warning"></i></div>
        <div class="error-code">403</div>
        <h1 class="error-title">Access Denied</h1>
        <div class="divider"></div>
        <p class="error-msg">
            You don't have permission to access this page.<br>
            Your account may have been blocked or you're trying to access a restricted area.
        </p>
        <a href="/" class="btn">
            <i class="ph-bold ph-house"></i> Back to Home
        </a>
        <p class="footer-text">If you believe this is an error, contact support.</p>
    </div>
</body>

</html>
{{end}}
