{{define "kanban"}}
<!DOCTYPE html>
<html lang="id">

<head>
    {{template "head" .}}
    <title>atstex-lab — Pelacak Lamaran Kerja</title>
    <link rel="stylesheet" href="/static/css/kanban.css">
</head>

<body class="flex flex-col md:flex-row h-dvh w-full bg-bg font-ui text-text overflow-hidden">
    <!-- Mobile Header overlay toggle -->
    <div class="md:hidden flex items-center justify-between p-4 bg-surface border-b-[4px] border-border z-40">
        <div class="font-disp font-extrabold text-2xl">ATSTEX<em class="text-accent italic">LAB</em></div>
        <button id="sidebar-toggle" class="text-3xl"><i class="ph ph-list"></i></button>
    </div>

    <!-- The Sidebar -->
    {{template "sidebar" .}}

    <!-- Overlay for mobile clicking -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden"></div>

    <main class="flex-1 min-h-0 overflow-y-auto bg-bg relative p-6 md:p-10">
        <div class="container mx-auto px-4 py-8">
            <div class="flex flex-col md:flex-row md:justify-between items-start md:items-center gap-4 mb-6">
                <h1 class="text-2xl md:text-3xl font-extrabold uppercase tracking-wide border-b-[3px] border-border pb-2 flex items-center gap-3 w-full md:w-auto">
                    <i class="ph-bold ph-columns text-3xl"></i> Lamaran Kerja
                </h1>
                <button id="add-job-btn" class="btn btn-primary w-full md:w-auto justify-center md:mt-[-8px]">
                    <i class="ph-bold ph-plus"></i> <span class="btn-label">Tambah Lamaran</span>
                </button>
            </div>

            <!-- Stats Pipeline Funnel -->
            <div id="stats-panel" class="stats-panel">
                <div class="stats-funnel">
                    <div class="stats-stage" data-stage="Applied">
                        <span class="stats-count" id="stats-applied">0</span>
                        <span class="stats-label">Dilamar</span>
                    </div>
                    <span class="stats-arrow"><i class="ph-bold ph-arrow-right"></i></span>
                    <div class="stats-stage" data-stage="Interview">
                        <span class="stats-count" id="stats-interview">0</span>
                        <span class="stats-label">Wawancara</span>
                    </div>
                    <span class="stats-arrow"><i class="ph-bold ph-arrow-right"></i></span>
                    <div class="stats-stage" data-stage="Offer">
                        <span class="stats-count" id="stats-offer">0</span>
                        <span class="stats-label">Penawaran</span>
                    </div>
                    <span class="stats-arrow"><i class="ph-bold ph-arrow-right"></i></span>
                    <div class="stats-stage" data-stage="Rejected">
                        <span class="stats-count" id="stats-rejected">0</span>
                        <span class="stats-label">Ditolak</span>
                    </div>
                </div>
            </div>

            <div id="kanban-board" class="flex flex-col md:flex-row gap-4 h-full min-h-[60vh]">
                <div class="kanban-column" data-status="Applied">
                    <h2>Dilamar</h2>
                    <div class="card-container"></div>
                </div>
                <div class="kanban-column" data-status="Interview">
                    <h2>Wawancara</h2>
                    <div class="card-container"></div>
                </div>
                <div class="kanban-column" data-status="Offer">
                    <h2>Penawaran</h2>
                    <div class="card-container"></div>
                </div>
                <div class="kanban-column" data-status="Rejected">
                    <h2>Ditolak</h2>
                    <div class="card-container"></div>
                </div>
            </div>
        </div>

        <!-- Add/Edit Modal -->
        <div id="job-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-surface border-[3px] border-border shadow-[8px_8px_0_#000] w-full max-w-md p-6 relative">
                <button id="cancel-btn-top" class="absolute top-4 right-4 text-2xl outline-none hover:text-error transition-colors"><i class="ph-bold ph-x"></i></button>
                <h3 class="font-disp font-extrabold text-2xl uppercase tracking-tight mb-4 border-b-2 border-border pb-2" id="modal-title">Tambah Lamaran</h3>
                <form id="job-form" class="flex flex-col gap-4">
                    <input type="hidden" id="application-id">
                    <div class="flex flex-col gap-1">
                        <label for="company" class="text-xs font-bold uppercase tracking-wider text-muted">Perusahaan</label>
                        <input type="text" id="company" name="company" class="form-input" required>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="job-title" class="text-xs font-bold uppercase tracking-wider text-muted">Posisi Pekerjaan</label>
                        <input type="text" id="job-title" name="job-title" class="form-input" required>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="cv-profile" class="text-xs font-bold uppercase tracking-wider text-muted">Profil CV</label>
                        <select id="cv-profile" name="cv-profile" class="form-input" required>
                            <!-- Options will be populated by JS -->
                        </select>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="notes" class="text-xs font-bold uppercase tracking-wider text-muted">Catatan</label>
                        <textarea id="notes" name="notes" rows="3" class="form-input"></textarea>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="deadline" class="text-xs font-bold uppercase tracking-wider text-muted">Tenggat Waktu (Opsional)</label>
                        <input type="date" id="deadline" name="deadline" class="form-input">
                    </div>
                    <div class="flex gap-3 mt-4">
                        <button type="button" id="cancel-btn" class="btn btn-ghost flex-1 justify-center">Batal</button>
                        <button type="button" id="save-job-btn" class="btn btn-primary flex-1 justify-center">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="/static/js/kanban.js"></script>

    <script src="/static/js/dark-mode.js"></script>
</body>
</html>
{{end}}
